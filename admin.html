<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1">

    <title>YRMS Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;800&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/admin.css">

    <style>

        body {
            font-family: 'Cairo', sans-serif;
        }

        /* =========================
           Login
        ========================= */

        #loginScreen {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .login-card {

            width: 100%;

            max-width: 420px;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.10);

            background: white;

        }

        .login-title {

            font-weight: 800;

            margin-bottom: 25px;

            text-align: center;

        }

        #loginError {

            display: none;

        }

        /* =========================
           Admin
        ========================= */

        #adminContent {

            display: none;

        }

    </style>

</head>


<body>


<!-- ==========================================
     LOGIN SCREEN
========================================== -->

<div id="loginScreen">

    <div class="login-card">

        <h3 class="login-title">
            🔐 لوحة إدارة YRMS
        </h3>


        <div class="mb-3">

            <label
                for="adminUsername"
                class="form-label">

                اسم المستخدم

            </label>

            <input
                type="text"
                id="adminUsername"
                class="form-control"
                placeholder="Username"
                autocomplete="username">

        </div>


        <div class="mb-3">

            <label
                for="adminPassword"
                class="form-label">

                كلمة المرور

            </label>

            <input
                type="password"
                id="adminPassword"
                class="form-control"
                placeholder="Password"
                autocomplete="current-password">

        </div>


        <div
            id="loginError"
            class="alert alert-danger text-center">

            اسم المستخدم أو كلمة المرور غير صحيحة

        </div>


        <button
            id="loginBtn"
            class="btn btn-dark w-100">

            دخول

        </button>

    </div>

</div>



<!-- ==========================================
     ADMIN CONTENT
========================================== -->

<div
    id="adminContent"
    class="container py-4">


    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="mb-0">
            لوحة الإدارة
        </h2>


        <button
            id="logoutBtn"
            class="btn btn-outline-danger">

            تسجيل الخروج

        </button>

    </div>



    <!-- =========================
         Dashboard Cards
    ========================= -->

    <div class="row g-3">


        <div class="col-md-3">

            <div class="card dashboard-card">

                <h3 id="doctorCount">
                    0
                </h3>

                <p>
                    عدد الأطباء
                </p>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card dashboard-card">

                <h3 id="clinicCount">
                    0
                </h3>

                <p>
                    عدد العيادات
                </p>

            </div>

        </div>



        <div class="col-md-3">

            <div class="card dashboard-card">
                <h3 id="referralCount">
                    0
                </h3>

                <p>
                    الإحالات
                </p>

            </div>

        </div>


    </div>



    <hr class="my-5">



    <!-- =========================
         Navigation
    ========================= -->

    <div class="d-grid gap-3">


        <a
            href="doctors.html"
            class="btn btn-dark btn-lg">

            👨‍⚕️ الأطباء

        </a>



        <a
            href="clinics.html"
            class="btn btn-warning btn-lg">

            🏥 العيادات

        </a>



        <a
            href="referrals.html"
            class="btn btn-outline-dark btn-lg">

            📋 الإحالات

        </a>


    </div>


</div>



<script>
   const LOGIN_API =
    "https://script.google.com/macros/s/AKfycbwl_YFz58K6Cu1238_fbS4UoQkp5JIhpq9x7lLhWw0jdibnjf-obpgb-V9MPtuK7fg/exec";


const loginScreen =
    document.getElementById("loginScreen");

const adminContent =
    document.getElementById("adminContent");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const usernameInput =
    document.getElementById("adminUsername");

const passwordInput =
    document.getElementById("adminPassword");

const loginError =
    document.getElementById("loginError");


// ==========================================
// SHOW LOGIN
// ==========================================

function showLogin() {

    loginScreen.style.display = "flex";

    adminContent.style.display = "none";

}


// ==========================================
// SHOW ADMIN
// ==========================================

function showAdmin() {

    loginScreen.style.display = "none";

    adminContent.style.display = "block";

}


// ==========================================
// LOGIN
// ==========================================

loginBtn.addEventListener(
    "click",
    async function () {

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        if (!username || !password) {

            loginError.textContent =
                "أدخل اسم المستخدم وكلمة المرور";

            loginError.style.display =
                "block";

            return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "جاري التحقق...";


        try {

            const url =
                LOGIN_API +
                "?action=login" +
                "&username=" +
                encodeURIComponent(username) +
                "&password=" +
                encodeURIComponent(password);


            const response =
                await fetch(url);


            const result =
                await response.json();


            if (result.success) {

                sessionStorage.setItem(
                    "yrmsAdminLoggedIn",
                    "true"
                );


                loginError.style.display =
                    "none";


                usernameInput.value = "";

                passwordInput.value = "";


                showAdmin();


            } else {

                loginError.textContent =
                    "اسم المستخدم أو كلمة المرور غير صحيحة";

                loginError.style.display =
                    "block";

            }


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            loginError.textContent =
                "تعذر الاتصال بخادم تسجيل الدخول";

            loginError.style.display =
                "block";

        }


        loginBtn.disabled = false;

        loginBtn.textContent =
            "دخول";

    }
);


// ==========================================
// ENTER KEY
// ==========================================

passwordInput.addEventListener(
    "keydown",
    function (e) {

        if (e.key === "Enter") {

            loginBtn.click();

        }

    }
);


// ==========================================
// LOGOUT
// ==========================================

logoutBtn.addEventListener(
    "click",
    function () {

        sessionStorage.removeItem(
            "yrmsAdminLoggedIn"
        );

        showLogin();

    }
);


// ==========================================
// CHECK SESSION
// ==========================================

if (
    sessionStorage.getItem(
        "yrmsAdminLoggedIn"
    ) === "true"
) {

    showAdmin();

} else {

    showLogin();

}
</script>


<script
    type="module"
    src="js/admin.js">
</script>


</body>

</html>
