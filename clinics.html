<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Clinics</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

<style>

body {
    background: #f8f9fa;
}

/* =========================
   Romexis status
========================= */

.romexis-date-wrapper {
    display: flex;
    align-items: center;
    gap: 8px;
}

.romexis-date-wrapper input {
    min-width: 155px;
}

.romexis-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 700;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
}

.status-active .status-dot {
    background: #198754;
}

.status-warning .status-dot {
    background: #dc3545;
}

.status-inactive .status-dot {
    background: #6c757d;
}

.warning-icon {
    color: #dc3545;
    font-size: 18px;
    font-weight: bold;
}

/* =========================
   Mobile
========================= */

@media (max-width: 768px) {

    table {
        font-size: 13px;
    }

    .romexis-date-wrapper {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>

</head>


<body>

<div class="container py-4">

    <!-- =========================
         Header
    ========================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="mb-3">

            <h2 class="m-0">
                قائمة العيادات
            </h2>

            <input
                type="text"
                id="searchClinic"
                class="form-control mt-2"
                placeholder="🔍 ابحث باسم العيادة أو الكود">

        </div>

        <button
            class="btn btn-success"
            id="addClinicBtn">

            ➕ إضافة عيادة

        </button>

    </div>


    <!-- =========================
         Clinics Table
    ========================= -->

    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead>

                <tr>

                    <th>Clinic Code</th>

                    <th>Clinic Name</th>

                    <th>تفعيل Romexis</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="clinicTable">

            </tbody>

        </table>

    </div>

</div>



<!-- ==========================================
     Add / Edit Clinic Modal
========================================== -->

<div class="modal fade" id="clinicModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="clinicModalTitle">

                    إضافة عيادة

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        كود العيادة
                    </label>

                    <input
                        id="clinicCodeInput"
                        class="form-control">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        اسم العيادة
                    </label>

                    <input
                        id="clinicNameInput"
                        class="form-control">

                </div>


                <!-- =========================
                     Romexis Date
                ========================= -->

                <div class="mb-3">

                    <label class="form-label">
                        تاريخ تفعيل Romexis
                    </label>

                    <input
                        type="date"
                        id="romexisDateInput"
                        class="form-control">

                    <div class="form-text">
                        يبدأ التنبيه بعد مرور 50 يوم من هذا التاريخ.
                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    إلغاء

                </button>

                <button
                    class="btn btn-success"
                    id="saveClinicBtn">

                    حفظ

                </button>

            </div>

        </div>

    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/clinics.js"></script>

</body>

</html>
