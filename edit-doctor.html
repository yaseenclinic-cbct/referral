<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Doctor</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    rel="stylesheet">

<style>

.qr-preview {
    width: 180px;
    height: 180px;
    object-fit: contain;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 5px;
    background: white;
}

</style>

</head>

<body>

<div class="container py-4">

    <h2 class="mb-4">
        تعديل الطبيب
    </h2>


    <!-- ========================================
         Doctor Name
    ======================================== -->

    <div class="mb-3">

        <label class="form-label">
            اسم الطبيب
        </label>

        <input
            type="text"
            id="doctorName"
            class="form-control">

    </div>


    <!-- ========================================
         Clinic
    ======================================== -->

    <div class="mb-3">

        <label class="form-label">
            العيادة
        </label>

        <select
            id="doctorClinic"
            class="form-select">

        </select>

    </div>


    <!-- ========================================
         QR Code
    ======================================== -->

    <div class="mb-4">

        <label class="form-label fw-bold">
            QR Code
        </label>


        <div class="mb-3">

            <img
                id="qrPreview"
                class="qr-preview"
                src=""
                alt="QR Code"
                style="display:none;">

        </div>


        <div class="mb-3">

            <input
                type="file"
                id="qrInput"
                class="form-control"
                accept="image/png,image/jpeg,image/webp">

        </div>


        <small class="text-muted">

            اختر صورة QR Code من جهازك.
            يمكنك استبدال الصورة الحالية بأي صورة جديدة.

        </small>

    </div>


    <!-- ========================================
         Buttons
    ======================================== -->

    <button
        class="btn btn-success"
        id="saveBtn">

        حفظ التعديلات

    </button>


    <a
        href="doctors.html"
        class="btn btn-secondary">

        رجوع

    </a>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script
    type="module"
    src="js/edit-doctor.js">
</script>

</body>

</html>
