<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Referrals</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

</head>


<body>

<div class="container py-4">

    <h2 class="mb-4">
        الإحالات
    </h2>


    <div class="mb-3">

        <input
            type="text"
            id="searchReferral"
            class="form-control"
            placeholder="🔍 ابحث باسم الطبيب أو العيادة أو المريض أو الهاتف"
        >

    </div>


    <div class="table-responsive">

        <table class="table table-bordered table-hover align-middle">

            <thead>

                <tr>

                    <th>الطبيب</th>

                    <th>العيادة</th>

                    <th>المريض</th>

                    <th>العمر</th>

                    <th>الهاتف</th>

                    <th>الجنس</th>

                    <th>الأشعة</th>

                    <th>الملاحظات</th>

                    <th>تاريخ الإحالة</th>

                    <th>Date of CBCT</th>

                    <th>CBCT Price</th>

                    <th>Done?</th>

                    <th>الإجراءات</th>

                </tr>

            </thead>


            <tbody id="referralTable">

            </tbody>

        </table>

    </div>

</div>


<!-- Referral Details Modal -->

<div
    class="modal fade"
    id="referralModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    تفاصيل الإحالة
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <p>
                    <strong>الطبيب:</strong>
                    <span id="viewDoctor"></span>
                </p>

                <p>
                    <strong>العيادة:</strong>
                    <span id="viewClinic"></span>
                </p>

                <p>
                    <strong>المريض:</strong>
                    <span id="viewPatient"></span>
                </p>

                <p>
                    <strong>العمر:</strong>
                    <span id="viewAge"></span>
                </p>

                <p>
                    <strong>الجنس:</strong>
                    <span id="viewGender"></span>
                </p>

                <p>
                    <strong>الهاتف:</strong>
                    <span id="viewPhone"></span>
                </p>

                <p>
                    <strong>الأشعة:</strong>
                    <span id="viewXrays"></span>
                </p>

                <p>
                    <strong>الملاحظات:</strong>
                    <span id="viewNotes"></span>
                </p>

                <p>
                    <strong>تاريخ الإحالة:</strong>
                    <span id="viewDate"></span>
                </p>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script
    type="module"
    src="js/referrals.js"
></script>

</body>

</html>
